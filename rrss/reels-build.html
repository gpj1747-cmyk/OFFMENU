<style>
/* Lienzo 1080 × 1920. Tipografía cinética: líneas que entran por corte seco, sin fundidos,
   y la tachadura roja que se dibuja de izquierda a derecha en 0,25 s. */
:root{--granate:#42000E; --rojo:#F5302A; --blanco:#FFFFFF; --negro:#141518; --gris:#5F5B59;
 --f-d:'Schibsted Grotesk',Arial,sans-serif; --f-m:'IBM Plex Mono',monospace}
*{box-sizing:border-box}
html,body{margin:0; background:#000}
#stage{width:1080px; height:1920px; position:relative; overflow:hidden; font-family:var(--f-d); -webkit-font-smoothing:antialiased}
.scene{position:absolute; inset:0; padding:230px 170px 420px 90px; display:none; flex-direction:column}
.scene.on{display:flex}
.stack{display:flex; flex-direction:column; gap:14px}
.bottom{margin-top:auto}
.it{visibility:hidden}
.it.on{visibility:visible}
.xl{font-weight:900; font-size:160px; letter-spacing:-.05em; line-height:.9}
.l{font-weight:900; font-size:108px; letter-spacing:-.05em; line-height:.92}
.xlm{font-weight:900; font-size:132px; letter-spacing:-.05em; line-height:.92}
.m{font-weight:800; font-size:72px; letter-spacing:-.035em; line-height:1}
.mono{font-family:var(--f-m); font-weight:500; font-size:44px; letter-spacing:.06em; text-transform:uppercase}
.monol{font-family:var(--f-m); font-weight:400; font-size:54px; line-height:1.3}
.dim{opacity:.5}
.gr{color:var(--granate)} .rj{color:var(--rojo)} .rt{color:#D8241E}
.s{}
.sw{position:relative}
.sw::after{content:""; position:absolute; left:-.04em; right:-.04em; top:56%; height:.09em; min-height:2px; background:var(--rojo); transform:translateY(-50%) scaleX(var(--p,0)); transform-origin:0 50%; pointer-events:none}
.lgv{display:inline-block; line-height:0} .lgv svg{height:1em; width:auto; display:block}
.bw{background:var(--blanco); color:var(--negro)}
.bg{background:var(--granate); color:var(--blanco); --line:var(--rojo)}
.bk{background:var(--negro); color:var(--blanco); --line:var(--rojo)}
.bw .lg{color:var(--granate); --line:var(--rojo)}
.mid{flex:1; display:flex; flex-direction:column; justify-content:center; gap:14px}
.xxm{font-weight:900; font-size:176px; letter-spacing:-.05em; line-height:.9; white-space:nowrap}
.xxl{font-weight:900; font-size:300px; letter-spacing:-.06em; line-height:.85; font-variant-numeric:tabular-nums}
.cnt{font-variant-numeric:tabular-nums}
.pdf{font-family:var(--f-m); font-size:21px; line-height:1.4; color:#c9c9c9; white-space:pre; will-change:transform}
.typ::after{content:""}
.rule{height:3px; background:currentColor; opacity:.35; margin:26px 0}
</style>
</head>
